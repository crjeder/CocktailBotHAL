openapi: 3.1.0
info:
  title: Cocktail Robot HAL API
  version: 1.0.0
servers:
  - url: http://robot.local/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Auth for admin-only endpoints.  Username is always `admin`;
        password is the value set via `PATCH /config` (`admin_password` field).
        Default password is `changeme` — change before deployment.

  schemas:

    GlassWaitReason:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum: [no_glass]
          required: [type]
        - type: object
          properties:
            type:
              type: string
              enum: [too_small]
            detected_volume:
              type: number
            required_volume:
              type: number
          required: [type, detected_volume, required_volume]
      discriminator:
        propertyName: type

    RecoveryAction:
      type: string
      enum: [put_glass_back, remove_glass, call_reset_errors, none]

    RobotState:
      description: |
        Current state of the robot.  A discriminated union tagged by the `state`
        field.  Active variants carry job context and timeout countdowns.
      oneOf:
        - type: object
          description: Unit states — no additional fields.
          properties:
            state:
              type: string
              enum: [off, self_test, idle, cleaning, provisioning]
          required: [state]
        - type: object
          description: Robot is waiting for a glass before dispensing begins.
          properties:
            state:
              type: string
              enum: [waiting_for_glass]
            job_id:
              type: string
            reason:
              $ref: '#/components/schemas/GlassWaitReason'
            timeout_remaining_secs:
              type: integer
              nullable: true
          required: [state, job_id, reason]
        - type: object
          description: Robot is actively dispensing.
          properties:
            state:
              type: string
              enum: [working]
            job_id:
              type: string
            progress_pct:
              type: integer
              minimum: 0
              maximum: 100
          required: [state, job_id, progress_pct]
        - type: object
          description: Dispensing complete; waiting for glass removal.
          properties:
            state:
              type: string
              enum: [drink_ready]
            job_id:
              type: string
            timeout_remaining_secs:
              type: integer
              nullable: true
          required: [state, job_id]
        - type: object
          description: An error has occurred.
          properties:
            state:
              type: string
              enum: [error]
            code:
              type: string
            message:
              type: string
            job_id:
              type: string
              nullable: true
            recoverable:
              type: boolean
            recovery:
              $ref: '#/components/schemas/RecoveryAction'
            timeout_remaining_secs:
              type: integer
              nullable: true
          required: [state, code, message, recoverable, recovery]
      discriminator:
        propertyName: state

    ErrorObject:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        hint:
          type: string
        recoverable:
          type: boolean

    GlassType:
      type: object
      properties:
        id:
          type: string
          description: Size name, e.g. "short", "medium", "long".
        volume:
          type: number
          description: |
            Abstract dispenser volume in operator-defined units (ml, cl, oz, etc.).
            Must be consistent with all other `volume` values and all
            `LiquidCalibration.factor` values within a single robot.

    LiquidCalibration:
      type: object
      properties:
        factor:
          type: number
          description: |
            Hardware-agnostic calibration multiplier for this liquid.
            Interpretation is HAL-implementation-specific (e.g. density in g/ml
            for weight-based dispensing, seconds/ml for time-based). A value of
            1.0 delivers the computed volume without adjustment.

    LiquidConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: integer
        calibration:
          $ref: '#/components/schemas/LiquidCalibration'

    Capabilities:
      type: object
      properties:
        version:
          type: string
          description: Firmware / hardware version string (e.g. "0.5.0").
        level_reporting:
          type: string
          enum: [binary, decimal]
        glass_typing:
          type: boolean
        simultaneous_channels:
          type: integer
        max_queue_depth:
          type: integer
          description: Maximum number of jobs (running + queued) accepted simultaneously.
        has_cancel_button:
          type: boolean
          description: |
            `true` if the hardware has a physical button that cancels the active job.
            Clients SHOULD hide the software cancel button when `true`.
        has_power_button:
          type: boolean
          description: |
            `true` if the hardware has a physical power button (long-press powers off).
            Separate capability from `has_cancel_button` even if on the same physical button.

    AdminConfig:
      type: object
      description: |
        Admin-owned configuration.  Persisted to flash via `POST /config/restore`
        or `PATCH /config`.  Does not include hardware-fixed capabilities.
      properties:
        liquids:
          type: array
          items:
            $ref: '#/components/schemas/LiquidConfig'
        glass_types:
          type: array
          description: Available glass sizes; maps size names to target volumes.
          items:
            $ref: '#/components/schemas/GlassType'
        token:
          type: string
          description: Bearer token for non-admin API access. Default is "changeme".
        admin_password:
          type: string
          description: |
            Write-only.  When supplied in `PATCH /config` or `POST /config/restore`,
            treated as the new plaintext admin password — it is hashed before storage.
            Always returned as `""` in `GET /config` responses (hash is never exposed).
        glass_wait_timeout_secs:
          type: integer
          default: 60
          description: |
            Seconds to wait for glass placement before cancelling the job.
            A value of `0` means wait indefinitely.  Defaults to `60`.
        drink_ready_timeout_secs:
          type: integer
          default: 300
          description: |
            Seconds after dispensing completes before emitting a `DRINK_ABANDONED`
            error.  A value of `0` means wait indefinitely.  Defaults to `300`.

    Config:
      type: object
      description: |
        Merged API-facing configuration returned by `GET /config`.
        Combines `AdminConfig` fields with hardware-fixed `Capabilities`.
      properties:
        liquids:
          type: array
          items:
            $ref: '#/components/schemas/LiquidConfig'
        glass_types:
          type: array
          description: Available glass sizes.
          items:
            $ref: '#/components/schemas/GlassType'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        token:
          type: string
        admin_password:
          type: string
          description: Always returned as "". See AdminConfig.admin_password.
        glass_wait_timeout_secs:
          type: integer
        drink_ready_timeout_secs:
          type: integer

    BackupPayload:
      type: object
      description: |
        Returned by `GET /config/backup` and accepted by `POST /config/restore`.
        Contains the full admin configuration with a CRC32 checksum for integrity
        verification.
      properties:
        data:
          $ref: '#/components/schemas/AdminConfig'
        checksum:
          type: string
          description: |
            CRC32/ISO-HDLC hex checksum (8 lowercase hex chars) of the
            JSON-serialised `data` field.  Verified by the server on restore.
        backed_up_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of when the backup was created.

    GlassSensor:
      type: object
      properties:
        present:
          type: boolean
        type:
          type: string
          nullable: true
        confidence:
          type: number
        updated_at:
          type: string
          format: date-time

    LevelBinary:
      type: object
      properties:
        id:
          type: string
        mode:
          type: string
          enum: [binary]
        ok:
          type: boolean

    LevelDecimal:
      type: object
      properties:
        id:
          type: string
        mode:
          type: string
          enum: [decimal]
        remaining_ml:
          type: number

    JobItem:
      type: object
      properties:
        liquid_id:
          type: string
        parts:
          type: number

    JobCreateRequest:
      type: object
      required:
        - name
        - size
        - items
      properties:
        name:
          type: string
          description: Human-readable label for the drink order (e.g. Marty's Margarita). Need not be unique.
        size:
          type: string
          enum: [short, medium, long]
          description: |
            Requested cocktail size. The server resolves the target volume by
            looking up this value in the active config's `glass_types` list.
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
        parallel:
          type: boolean

    JobCreateResponse:
      type: object
      properties:
        job_id:
          type: string
          description: Server-generated unique job identifier.
        queue_position:
          type: integer
          description: 1-based position in the queue (1 = next to be dispensed).

    JobStatus:
      type: object
      properties:
        job_id:
          type: string
        name:
          type: string
          description: Human-readable label supplied by the client at job creation.
        state:
          type: string
          enum: [queued, active, done, cancelled, error]
        progress_pct:
          type: number

    ConfigMutationResponse:
      type: object
      properties:
        status:
          type: string
          enum: [updated, restored]
        cancelled_job_ids:
          type: array
          items:
            type: string
          description: |
            IDs of jobs that were cancelled during the pre-flight queue flush
            before applying the config change.

security:
  - bearerAuth: []

paths:

  /status:
    get:
      summary: Get system status
      description: |
        Returns the current `RobotState` as a tagged-union JSON object with an
        additional top-level `errors` array.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RobotState'
                  - type: object
                    properties:
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorObject'

  /control/power:
    post:
      summary: Power on/off robot hardware
      security:
        - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                on:
                  type: boolean
      responses:
        '202': { description: Accepted }

  /control/power-save:
    post:
      summary: Enable or disable power save mode
      security:
        - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200': { description: OK }

  /control/reset:
    post:
      summary: Clear error states and reset to idle
      security:
        - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clear_errors:
                  type: boolean
      responses:
        '200': { description: OK }

  /config:
    get:
      summary: Get active (RAM) configuration
      description: |
        Returns the merged configuration view: admin-owned fields plus
        hardware-fixed capabilities.  `admin_password` is always returned
        as `""` (the hash is never exposed).

        Available in `provisioning` state.
      responses:
        '200':
          description: Active config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'

    patch:
      summary: Update active configuration
      security:
        - basicAuth: []
      description: |
        Update the admin-owned configuration.  Supplying a non-empty
        `admin_password` field sets a new admin password — it is hashed
        before storage.  Send `""` (or omit the field) to keep the current
        admin password unchanged.

        **Pre-flight:** All queued jobs are cancelled and any running job is
        awaited before the config is applied.  The response includes the IDs
        of cancelled jobs.

        **Auto-persist:** The new config is written to flash automatically.
        No separate restore step is needed.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminConfig'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigMutationResponse'

  /config/backup:
    get:
      summary: Read configuration backup from non-volatile storage
      security:
        - basicAuth: []
      description: |
        Returns the persisted `AdminConfig` along with a CRC32 checksum and
        creation timestamp.  Returns `500` if no configuration has been stored
        yet (first boot / factory reset).
      responses:
        '200':
          description: Backup payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupPayload'
        '500':
          description: No stored configuration (flash empty or corrupt)

  /config/restore:
    post:
      summary: Restore configuration from a backup payload
      security:
        - basicAuth: []
      description: |
        Accepts a `BackupPayload` (as produced by `GET /config/backup`) and
        restores the admin configuration.  The server verifies the CRC32
        checksum before applying; returns `422` on mismatch.

        **Pre-flight:** Same as `PATCH /config` — queued jobs are cancelled,
        running job is awaited.

        If the robot is in `provisioning` state, a successful restore
        transitions it to `idle`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [data, checksum]
              properties:
                data:
                  $ref: '#/components/schemas/AdminConfig'
                checksum:
                  type: string
                  description: CRC32 hex string from the original backup payload.
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigMutationResponse'
        '422':
          description: Checksum mismatch

  /sensors/glass:
    get:
      summary: Glass presence and type
      responses:
        '200':
          description: Glass sensor data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlassSensor'

  /sensors/levels:
    get:
      summary: Liquid levels (binary or decimal)
      responses:
        '200':
          description: Levels
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/LevelBinary'
                    - $ref: '#/components/schemas/LevelDecimal'

  /dispense/jobs:
    post:
      summary: Mix a Cocktail (Create a dispensing job)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '503':
          description: Job queue is full or robot is in provisioning state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: queue full

    get:
      summary: List job queue and history
      responses:
        '200':
          description: Jobs list

  /dispense/jobs/{job_id}:
    get:
      summary: Get job status
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'

    post:
      summary: Cancel job
      responses:
        '200': { description: Cancelled }

  /cleaning/start:
    post:
      summary: Start a simple cleaning program
      security:
        - basicAuth: []
      responses:
        '200': { description: Started }

  /cleaning/stop:
    post:
      summary: Stop cleaning
      security:
        - basicAuth: []
      responses:
        '200': { description: Stopped }

  /events:
    get:
      summary: Server-Sent Events stream
      description: |
        Long-lived SSE connection served on **port 80** (same port as the REST API).
        On connect the server sends an initial snapshot of the current
        robot state and all active/queued jobs, then emits change
        events as they occur (polled every 500ms).

        A `: keepalive` comment is sent every 30 seconds when idle.

        **Event types:**

        `state_change` — emitted when `RobotState` transitions.
        The payload is the full `RobotState` tagged-union object (same
        shape as `GET /status` minus the `errors` key).
        ```json
        {"state": "working", "job_id": "abc", "progress_pct": 42}
        ```

        `job_update` — emitted when a dispensing job is created,
        progresses, completes, or is cancelled.  Also emitted as a
        **terminal event** when a job disappears from the job list
        (e.g. the HAL retires it after completion); the payload carries
        the last-known state and progress at the time of departure.
        ```json
        {"job_id": "abc", "name": "xyz",
         "state": "active", "progress_pct": 45}
        ```
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
