openapi: 3.1.0
info:
  title: Cocktail Robot HAL API
  version: 1.0.0
servers:
  - url: http://robot.local/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Auth for admin-only endpoints.  Username is always `admin`;
        password is the value set via `PATCH /config` (`admin_password` field).
        Default password is `changeme` — change before deployment.

  schemas:

    State:
      type: string
      enum:
        - off
        - self_test
        - idle
        - prepared
        - working
        - cleaning
        - drink_ready
        - error

    ErrorObject:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        hint:
          type: string
        recoverable:
          type: boolean

    GlassType:
      type: object
      properties:
        id:
          type: string
          description: Size name, e.g. "short", "medium", "long".
        volume_ml:
          type: number
          description: Target fill volume in milliliters.

    LiquidCalibration:
      type: object
      properties:
        factor:
          type: number
          description: |
            Hardware-agnostic calibration multiplier for this liquid.
            Interpretation is HAL-implementation-specific (e.g. density in g/ml
            for weight-based dispensing, seconds/ml for time-based). A value of
            1.0 delivers the computed volume without adjustment.


    LiquidConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        position:
          type: integer
        calibration:
          $ref: '#/components/schemas/LiquidCalibration'

    Capabilities:
      type: object
      properties:
        level_reporting:
          type: string
          enum: [binary, decimal]
        glass_typing:
          type: boolean
        simultaneous_channels:
          type: integer
        max_queue_depth:
          type: integer
          description: Maximum number of jobs (running + queued) accepted simultaneously.

    Config:
      type: object
      properties:
        version:
          type: string
        liquids:
          type: array
          items:
            $ref: '#/components/schemas/LiquidConfig'
        glass_types:
          type: array
          description: Available glass sizes; maps size names to target volumes.
          items:
            $ref: '#/components/schemas/GlassType'
        max_total_parts:
          type: integer
          description: Maximum total parts accepted in a single job (safety limit).
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        admin_password:
          type: string
          description: |
            Write-only.  When supplied in `PATCH /config`, treated as the new
            plaintext admin password — it is hashed before storage.  Always
            returned as `""` in `GET /config` responses (hash is never exposed).

    ConfigStoragePayload:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Config'
        valid:
          type: boolean
        checksum:
          type: string

    GlassSensor:
      type: object
      properties:
        present:
          type: boolean
        type:
          type: string
          nullable: true
        confidence:
          type: number
        updated_at:
          type: string
          format: date-time

    LevelBinary:
      type: object
      properties:
        id:
          type: string
        mode:
          type: string
          enum: [binary]
        ok:
          type: boolean

    LevelDecimal:
      type: object
      properties:
        id:
          type: string
        mode:
          type: string
          enum: [decimal]
        remaining_ml:
          type: number

    JobItem:
      type: object
      properties:
        liquid_id:
          type: string
        parts:
          type: number

    JobCreateRequest:
      type: object
      required:
        - name
        - size
        - items
      properties:
        name:
          type: string
          description: Human-readable label for the drink order (e.g. Marty's Margarita). Need not be unique.
        size:
          type: string
          enum: [short, medium, long]
          description: |
            Requested cocktail size. The server resolves the target volume by
            looking up this value in the active config's `glass_types` list.
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
        parallel:
          type: boolean

    JobCreateResponse:
      type: object
      properties:
        job_id:
          type: string
          description: Server-generated unique job identifier.
        queue_position:
          type: integer
          description: 1-based position in the queue (1 = next to be dispensed).

    JobStatus:
      type: object
      properties:
        job_id:
          type: string
        name:
          type: string
          description: Human-readable label supplied by the client at job creation.
        state:
          type: string
          enum: [queued, running, done, cancelled, error]
        progress_pct:
          type: number

security:
  - bearerAuth: []

paths:

  /status:
    get:
      summary: Get system status
      responses:
        '200':
          description: OK

  /control/power:
    post:
      summary: Power on/off robot hardware
      security:
        - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                on:
                  type: boolean
      responses:
        '202': { description: Accepted }

  /control/power-save:
    post:
      summary: Enable or disable power save mode
      security:
        - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200': { description: OK }

  /control/reset:
    post:
      summary: Clear error states and reset to idle
      security:
        - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clear_errors:
                  type: boolean
      responses:
        '200': { description: OK }

  /control/reload-config:
    post:
      summary: Reload configuration from storage into active memory
      security:
        - basicAuth: []
      responses:
        '200': { description: Reloaded }

  /config:
    get:
      summary: Get active (RAM) configuration
      responses:
        '200':
          description: Active config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'

    patch:
      summary: Update active configuration
      security:
        - basicAuth: []
      description: |
        Update the active (RAM) configuration.  Supplying a non-empty
        `admin_password` field sets a new admin password — it is hashed
        before storage.  Send `""` (or omit the field) to keep the current
        admin password unchanged.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200': { description: Updated }

  /storage/config:
    get:
      summary: Read configuration from non-volatile storage
      security:
        - basicAuth: []
      responses:
        '200':
          description: Stored config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigStoragePayload'

    post:
      summary: Write configuration to non-volatile storage
      security:
        - basicAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Config'
                overwrite:
                  type: boolean
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  written_at: { type: string, format: date-time }
                  checksum: { type: string }
                  requires_reboot: { type: boolean }

  /sensors/glass:
    get:
      summary: Glass presence and type
      responses:
        '200':
          description: Glass sensor data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlassSensor'

  /sensors/levels:
    get:
      summary: Liquid levels (binary or decimal)
      responses:
        '200':
          description: Levels
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/LevelBinary'
                    - $ref: '#/components/schemas/LevelDecimal'

  /dispense/jobs:
    post:
      summary: Mix a Cocktail (Create a dispensing job)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '201':
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '503':
          description: Job queue is full
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: queue full

    get:
      summary: List job queue and history
      responses:
        '200':
          description: Jobs list

  /dispense/jobs/{job_id}:
    get:
      summary: Get job status
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'

    post:
      summary: Cancel job
      responses:
        '200': { description: Cancelled }

  /cleaning/start:
    post:
      summary: Start a simple cleaning program
      security:
        - basicAuth: []
      responses:
        '200': { description: Started }

  /cleaning/stop:
    post:
      summary: Stop cleaning
      security:
        - basicAuth: []
      responses:
        '200': { description: Stopped }

  /events:
    get:
      summary: Server-Sent Events stream
      description: |
        Long-lived SSE connection served on a **separate port (9000)**.
        On connect the server sends an initial snapshot of the current
        robot state and all active/queued jobs, then emits change
        events as they occur (polled every 500ms).

        A `: keepalive` comment is sent every 30 seconds when idle.

        **Event types:**

        `state_change` — emitted when `RobotState` transitions.
        ```json
        {"state": "working"}
        ```

        `job_update` — emitted when a dispensing job is created,
        progresses, completes, or is cancelled.
        ```json
        {"job_id": "abc", "name": "xyz",
         "state": "running", "progress_pct": 45}
        ```
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
