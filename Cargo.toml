[package]
name = "cocktail_bot_hal"
version = "0.3.0"
authors = ["crjeder <crjeder@gmail.com>"]
edition = "2021"

[dependencies]
embassy-executor = { version = "0.9", features = ["arch-spin", "executor-thread"] }
static_cell = "2"
embassy-net = { version = "0.8.0", features = ["tcp", "proto-ipv4", "medium-ethernet"] }
embassy-time = "0.5.0"
embedded-io-async = "0.7.0"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"   # serialize json for drink recepies

[features]
esp32 = []

[dev-dependencies]
#test-case = "3.2"
